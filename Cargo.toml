[package]
name = "echoic"
version = "2026.10.0"
edition = "2024"
rust-version = "1.98.1"
description = "Recursive DNS resolver with DNSSEC, DoT and DoH support"
license = "AGPL-3.0-only"
repository = "https://github.com/irql-notlessorequal/echoic"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
governor = "0.10"
hyper = "1.11"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
hickory-net = { version = "=0.26.3", features = ["tls-ring", "tokio"] }
metrics = "0.24.1"
hickory-server = { version = "=0.26.3", features = ["dnssec-ring", "metrics", "recursor", "tls-ring"] }
humantime-serde = "1.1"
ipnet = { version = "2.11", features = ["serde"] }
serde_json = "1.0"
moka = { version = "0.12", features = ["sync"] }
notify = "8.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15"
tokio-rustls = "0.26"
serde = { version = "1.0", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3.14"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

[patch.crates-io]
hickory-net = { path = "vendor/hickory-net-0.26.3" }
hickory-resolver = { path = "vendor/hickory-resolver-0.26.3" }
