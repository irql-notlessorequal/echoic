services:
  echoic:
    build: .
    image: echoic:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
      - "443:443/tcp"
    volumes:
      - ./deploy/echoic.container.toml.example:/etc/echoic/echoic.container.toml:ro
      - ./tls:/etc/echoic/tls:ro
    stop_signal: SIGTERM
